name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Type check
        run: cargo check --release --all-targets
      - name: Unit tests
        run: cargo test --release -- --nocapture
      - name: Clippy
        run: cargo clippy --release --all-targets
      - name: Formatting
        continue-on-error: true
        run: cargo fmt

  build:
    name: Build executable
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Collect artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/xmg-optimizer.exe dist/XMG-Optimizer.exe
          $f = Get-Item dist/XMG-Optimizer.exe
          "{0:N2} MB" -f ($f.Length / 1MB) | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: XMG-Optimizer-windows
          path: dist/XMG-Optimizer.exe
          if-no-files-found: error
          retention-days: 90