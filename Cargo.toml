[package]
name = "xmg-optimizer"
version = "1.1.0"
edition = "2021"
rust-version = "1.80"
description = "Safe, reversible Quiet/Performance power modes for the SCHENKER XMG FOCUS 15"
license = "MIT"
readme = "README.md"
keywords = ["power", "thermal", "xmg", "schenker", "windows", "optimization"]
categories = ["gui", "os::windows-apis"]
build = "build.rs"
exclude = ["assets/icon-preview.png"]

[dependencies]
# --- GUI -----------------------------------------------------------------
# The glow renderer keeps the dependency tree small and builds fast; the app
# has no need for compute shaders or VRAM-heavy pipelines.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui  = "0.36"

# --- Serialization -------------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Misc ----------------------------------------------------------------
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tray-icon = { version = "0.26", default-features = false }
winreg  = "0.56"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
] }

[build-dependencies]
# Locates rc.exe (MSVC) or windres (GNU) and embeds the icon + manifest.
winresource = "0.1"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
